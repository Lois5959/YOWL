version: '3.8'

services:
  mysql_db:
    image: mysql:8
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mvp_db
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - mysql_db
    ports:
      - "8084:80"   
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306

volumes:
  mysql_data: