name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer toute la stack
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Tests de fumée à travers Nginx
        run: |
          set -e
          B=http://localhost:8080/api
          curl -fsS $B/health
          curl -fsS -X POST $B/auth/register -H 'Content-Type: application/json' \
            -d '{"nom":"CI","email":"ci@example.com","password":"motdepasse-ci"}'
          TOKEN=$(curl -fsS -X POST $B/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"motdepasse-ci"}' | jq -r .token)
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/users)" = 401
          curl -fsS $B/users -H "Authorization: Bearer $TOKEN"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs
